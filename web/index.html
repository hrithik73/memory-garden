<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Garden">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#dedce2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15132a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Memory Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #dedce2;
    --ink: #2410d8;
    --ink-soft: #8a80d9;
    --pill: #e9e6f3;
    --pill-border: #d2cde6;
    --card: #ebe9f0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15132a; --ink: #a99cff; --ink-soft: #6b62a8;
      --pill: #221f3d; --pill-border: #353060; --card: #1d1a36;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15132a; --ink: #a99cff; --ink-soft: #6b62a8;
    --pill: #221f3d; --pill-border: #353060; --card: #1d1a36;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
  button, .cell, .slot { -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  body {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    display: flex; justify-content: center; overflow: hidden;
  }
  .app {
    width: 100%; max-width: 430px; height: 100dvh;
    display: flex; flex-direction: column; position: relative;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  svg.d { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; display: block; }

  header { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 20px 0 14px; }
  .pill {
    font: 500 13px/1 "IBM Plex Mono", ui-monospace, Menlo, monospace;
    padding: 7px 10px; border-radius: 8px; border: 1px solid var(--pill-border);
    background: var(--pill); color: var(--ink); cursor: pointer;
  }
  .pill.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); font-size: 15px; padding: 9px 14px; box-shadow: 0 6px 18px color-mix(in srgb, var(--ink) 30%, transparent); }
  .chev { background: none; border: 0; color: var(--ink-soft); font: inherit; font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .chev:disabled { opacity: .25; cursor: default; }

  main { flex: 1; min-height: 0; position: relative; }
  .view { position: absolute; inset: 0; transition: opacity .25s ease; }
  .view.hidden { opacity: 0; pointer-events: none; }

  /* year view */
  #year { overflow-y: auto; scrollbar-width: none; padding-bottom: 20px; }
  #year::-webkit-scrollbar { display: none; }
  .grid { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); row-gap: 6px; padding-top: 14px; }
  .cell { aspect-ratio: 1 / 1.25; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
  .cell .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink); }
  .cell.future .dot { opacity: .35; }
  .cell svg { width: 135%; height: 135%; flex: none; }
  .cell.today svg { width: 115%; height: 115%; }
  .cell:hover .dot { transform: scale(2); }
  .cell .dot { transition: transform .15s; }
  .cell { -webkit-touch-callout: none; }
  .tip {
    position: absolute; z-index: 5; pointer-events: none; max-width: 170px;
    background: var(--ink); color: var(--bg); border-radius: 8px; padding: 6px 10px; text-align: center;
    font: 12px/1.35 "IBM Plex Mono", ui-monospace, Menlo, monospace;
    box-shadow: 0 4px 12px rgb(0 0 0 / .15);
    opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s;
  }
  .tip.on { opacity: 1; transform: none; }
  .tip b { display: block; font-weight: 500; }
  .tip span { display: block; font-size: 11px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* day view */
  #day { display: flex; flex-direction: column; }
  .strip { display: flex; justify-content: center; gap: 6px; height: 56px; align-items: center; user-select: none; }
  .slot { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; opacity: .4; cursor: pointer; transition: opacity .2s, transform .2s; }
  .slot.sel { opacity: 1; transform: scale(1.1); }
  .slot svg { width: 38px; height: 38px; }
  .slot .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--ink); }
  .slot.empty { cursor: default; }
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 8px 40px; }
  .plant-btn { background: none; border: 0; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px; font: 500 15px "IBM Plex Mono", ui-monospace, Menlo, monospace; }
  .plant-btn svg { width: 56px; height: 56px; }
  .plant-btn:disabled { opacity: .35; cursor: default; }
  .memory { width: 100%; font-size: 15px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; cursor: text; }
  .date-line { color: var(--ink-soft); font-size: 12px; margin-bottom: 10px; }
  textarea {
    width: 100%; min-height: 120px; resize: none; border: 0; outline: 0; background: transparent;
    color: var(--ink); font: 16px/1.45 "IBM Plex Mono", ui-monospace, Menlo, monospace; caret-color: var(--ink); /* 16px stops iOS zooming in on focus */
  }
  textarea::placeholder { color: var(--ink-soft); }
  .done-row { width: 100%; display: flex; justify-content: flex-end; gap: 10px; margin-top: 12px; }
  .done { font-family: "Gaegu", cursive; font-size: 19px; background: var(--ink); color: var(--bg); border: 0; border-radius: 9px; padding: 6px 16px 4px; cursor: pointer; }
  .ghost { font: 13px "IBM Plex Mono", ui-monospace, Menlo, monospace; background: none; border: 0; color: var(--ink-soft); cursor: pointer; }
  .done-row { align-items: center; }
  .mic { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--ink); background: none; color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .mic svg { width: 22px; height: 22px; }
  .mic.on { background: var(--ink); color: var(--bg); }

  footer { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 0 18px; }
  .toggle { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--card); border: 1px solid var(--pill-border); }
  .toggle button { width: 44px; height: 44px; border-radius: 9px; border: 0; background: transparent; color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .toggle button svg { width: 30px; height: 30px; }
  .toggle button.on { background: var(--ink); color: var(--bg); }
  .meta { font-size: 12px; color: var(--ink-soft); display: flex; gap: 14px; align-items: center; }
  .meta b { color: var(--ink); font-weight: 500; }
  .meta button { font: inherit; background: none; border: 0; color: var(--ink-soft); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
  body.typing footer { display: none; }
</style>
</head>
<body>
<div class="app">
  <header id="hdr"></header>
  <main>
    <section class="view" id="year"><div class="grid" id="grid"></div></section>
    <section class="view hidden" id="day">
      <div class="strip" id="strip"></div>
      <div class="center" id="center"></div>
    </section>
  </main>
  <footer>
    <div class="toggle">
      <button id="tYear" aria-label="Garden view"></button>
      <button id="tDay" aria-label="Day view"></button>
    </div>
    <div class="meta">
      <span><b id="count">0</b><span id="countLabel"> memories planted</span></span>
      <button id="exp">export</button>
      <button id="imp">import</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
  </footer>
</div>

<script>
/* ---------- doodles (original line drawings, 32x32) ---------- */
const PLANTS = [
  // daisy
  '<path d="M16 31V17M16 25c-3-1-5-3-5-6M16 27c3-1 5-3 5-5"/><circle cx="16" cy="11" r="2.2"/><circle cx="16" cy="5.6" r="2.6"/><circle cx="21" cy="9.3" r="2.6"/><circle cx="19.1" cy="15.2" r="2.6"/><circle cx="12.9" cy="15.2" r="2.6"/><circle cx="11" cy="9.3" r="2.6"/>',
  // tulip
  '<path d="M16 31V15M16 26c-4 0-6-3-6-6 3 0 6 2 6 6M16 23c4 0 6-3 6-6-3 0-6 2-6 6"/><path d="M11 5l2.5 3L16 4l2.5 4L21 5v6a5 5 0 0 1-10 0z"/>',
  // mushroom
  '<path d="M5 16a11 9 0 0 1 22 0z"/><path d="M13 16v9a3 3 0 0 0 6 0v-9"/><circle cx="11.5" cy="11" r="1.3"/><circle cx="18.5" cy="9.5" r="1.6"/><circle cx="22" cy="13" r="1"/><path d="M8 30.5h16"/>',
  // grass tuft
  '<path d="M6 30c0-7-2-11-4-14M10 30c0-9 1-15 4-19M15 30c0-7-2-12-5-16M19 30c0-8 2-15 6-20M23 30c0-6 2-10 5-13M27 30c0-4-1-7-3-9"/>',
  // sprout
  '<path d="M16 31V14M16 19c0-6-5-9-11-9 0 6 5 9 11 9M16 15c0-5 4-8 10-8 0 5-4 8-10 8M11 31h10"/>',
  // rose
  '<path d="M16 31V17M16 27c-3 0-6-2-7-5 3-1 6 1 7 5M16 24c3 0 5-2 6-5-3-1-5 1-6 5"/><path d="M10.5 9.5c0 4 2.5 7.5 5.5 7.5s5.5-3.5 5.5-7.5"/><path d="M16 12c-2 0-3-1.5-3-3s1.5-3 3-3 3 1.2 3 2.6-1 2-2 2-1.6-.6-1.6-1.4"/>',
  // cherries
  '<path d="M17 4c-1 6-4 10-8 14M17 4c1 6 3 10 6 15M17 4c3-2 7-1 9 1-3 2-6 2-9-1"/><circle cx="9" cy="22" r="4"/><circle cx="23" cy="23" r="4"/><path d="M7.5 20.5l1 -1M21.5 21.5l1-1"/>',
  // cactus
  '<path d="M13 30V9a3 3 0 0 1 6 0v21M13 20H9.5a2 2 0 0 1-2-2v-5a1.5 1.5 0 0 1 3 0v4H13M19 17h2.5v-4a1.5 1.5 0 0 1 3 0v5a2 2 0 0 1-2 2H19M8 30.5h16M15 11v1M17 15v1M15 19v1M17 23v1"/>',
  // lavender
  '<path d="M10 31V13M16 31V8M22 31V13"/><path d="M10 13l-1.5-1.5M10 13l1.5-1.5M10 17l-1.5-1.5M10 17l1.5-1.5M16 8l-1.5-1.5M16 8l1.5-1.5M16 12l-1.5-1.5M16 12l1.5-1.5M16 16l-1.5-1.5M16 16l1.5-1.5M22 13l-1.5-1.5M22 13l1.5-1.5M22 17l-1.5-1.5M22 17l1.5-1.5"/>',
  // leaf
  '<path d="M7 30C7 18 13 8 26 4c0 12-6 22-19 26zM7 30l13-16M12 23l-4-2M15 19.5l-1-5M12 23l5 1M15 19.5l5 .5"/>',
  // berry bush
  '<path d="M16 31V20M16 27l-6-6M16 25l6-6"/><circle cx="16" cy="14.5" r="3.4"/><circle cx="9" cy="17.5" r="3"/><circle cx="23" cy="16.5" r="3"/><circle cx="12" cy="9" r="2.6"/><circle cx="20.5" cy="9" r="2.6"/>',
  // sunflower
  '<circle cx="16" cy="11" r="4"/><path d="M16 3v3M16 16v15M8 11h3M21 11h3M10.3 5.3l2.1 2.1M19.6 14.6l2.1 2.1M21.7 5.3l-2.1 2.1M12.4 14.6l-2.1 2.1M16 25c-3 0-5-2-6-4 3 0 5 1 6 4"/>',
  // fern
  '<path d="M16 31C16 20 14 12 9 4M15.3 24l-5-1M15.3 24l4.5-2.5M14.4 19l-4.5-1.5M14.4 19l4-3M13 14.5l-4-1.5M13 14.5l3.5-3M11.2 10l-3-1M11.2 10l3-2.5"/>',
  // bluebells
  '<path d="M9 31c0-10 3-18 10-24M19 7c2 0 4 1 5 3M13 14c-2 0-3 1-3 3M16 10.5c1.5 0 3 .5 3.5 2"/><path d="M8 17c0 2 1 3.5 2.5 3.5S13 19 13 17zM18 12.5c0 2 1 3.5 2.5 3.5S23 14.5 23 12.5zM22.5 10c0 2 1 3.5 2.5 3.5S27.5 12 27.5 10z"/>',
];
const HOUSE = '<path d="M4 13L16 3.5 28 13M7 11v19h18V11M5 30h22"/><circle cx="16" cy="17.5" r="3.6"/><path d="M16 24v3"/>';
const MIC = '<path d="M16 4.5a4 4 0 0 1 4 4v7a4 4 0 0 1-8 0v-7a4 4 0 0 1 4-4z"/><path d="M9 15a7 7 0 0 0 14 0M16 22v5M12 27.5h8"/>';
const PLUS  ='<path d="M16 4.5c6.6-.5 11.5 4.2 11.5 11s-4.6 12-11.3 12S4.6 22.5 4.5 16C4.4 9.5 9.6 4.9 15 4.2"/><path d="M16 10.5v11M10.5 16h11"/>';
const ICON_GARDEN = '<path d="M5 28v-9M5 23l-3-2M11 28V16M11 22l3-3M19 28v-8M26 28V15M26 21l-3-2"/><circle cx="5" cy="16" r="2.5"/><circle cx="11" cy="12.5" r="2.8"/><path d="M15 20a4 3 0 0 1 8 0z"/><circle cx="26" cy="11.5" r="2.8"/>';
const ICON_DAY = '<path d="M16 30V17M16 25c-3 0-5-2-5-4 3 0 5 1 5 4"/><circle cx="16" cy="11" r="2"/><circle cx="16" cy="6" r="2.4"/><circle cx="20.6" cy="9.4" r="2.4"/><circle cx="18.8" cy="14.6" r="2.4"/><circle cx="13.2" cy="14.6" r="2.4"/><circle cx="11.4" cy="9.4" r="2.4"/>';
const svg = (inner, cls = '') => `<svg class="d ${cls}" viewBox="0 0 32 32" aria-hidden="true">${inner}</svg>`;

/* ---------- storage ---------- */
const KEY = 'memory-garden-v1';
let memories = {};
try { memories = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(memories)); } catch {} };

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const hash = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const plantFor = k => PLANTS[hash(k) % PLANTS.length];
const pretty = k => fromKey(k).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
const short = k => fromKey(k).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }).toLowerCase();

/* ---------- state ---------- */
let view = 'year';
let year = new Date().getFullYear();
let sel = todayKey();
let editing = false;

const $ = id => document.getElementById(id);
$('tYear').innerHTML = svg(ICON_GARDEN);
$('tDay').innerHTML = svg(ICON_DAY);

function minYear() {
  const ys = Object.keys(memories).map(k => +k.slice(0, 4));
  return Math.min(new Date().getFullYear(), ...ys);
}

function renderHeader() {
  const h = $('hdr');
  if (view === 'year') {
    const nowY = new Date().getFullYear();
    h.innerHTML = `<button class="chev" id="py" ${year <= minYear() ? 'disabled' : ''}>‹</button>
      <span class="pill solid">${year}</span>
      <button class="chev" id="ny" ${year >= nowY ? 'disabled' : ''}>›</button>`;
    $('py').onclick = () => { year--; render(); };
    $('ny').onclick = () => { year++; render(); };
  } else {
    const t = sel === todayKey();
    h.innerHTML = `<button class="pill" id="tp">${t ? 'today' : short(sel)}</button>`;
    $('tp').onclick = () => { if (!editing) { sel = todayKey(); render(); } };
  }
}

function renderYear() {
  const g = $('grid');
  const tk = todayKey();
  let d = new Date(year, 0, 1), html = '';
  while (d.getFullYear() === year) {
    const k = keyOf(d);
    let inner, cls = 'cell';
    if (memories[k]) inner = svg(plantFor(k));
    else if (k === tk) { inner = svg(HOUSE); cls += ' today'; }
    else { inner = '<span class="dot"></span>'; if (k > tk) cls += ' future'; }
    html += `<div class="${cls}" data-k="${k}">${inner}</div>`;
    d.setDate(d.getDate() + 1);
  }
  g.innerHTML = html;
  hideTip();
  // keep the latest stretch of the garden in view
  const focus = g.querySelector(`[data-k="${sel.startsWith(year) ? sel : tk}"]`);
  if (focus) requestAnimationFrame(() => {
    const y = $('year');
    y.scrollTop = Math.max(0, focus.offsetTop - y.clientHeight * 0.6);
  });
}

function slotHTML(k) {
  const tk = todayKey();
  if (k > tk) return `<div class="slot empty"></div>`;
  let inner;
  if (memories[k]) inner = svg(plantFor(k));
  else if (k === tk) inner = svg(HOUSE);
  else inner = '<span class="dot"></span>';
  return `<div class="slot ${k === sel ? 'sel' : ''}" data-k="${k}" title="${short(k)}">${inner}</div>`;
}

function renderDay() {
  let s = '';
  for (let i = -3; i <= 3; i++) s += slotHTML(addDays(sel, i));
  $('strip').innerHTML = s;

  const c = $('center');
  const m = memories[sel];
  if (editing) {
    c.innerHTML = `<div style="width:100%">
      <div class="date-line">${pretty(sel)}</div>
      <textarea id="ta" placeholder="Add a memory..." maxlength="2000"></textarea>
      <div class="done-row">${SR ? `<button class="mic" id="mic" aria-label="Speak your memory">${svg(MIC)}</button><span class="ghost" id="listening" hidden>listening…</span><span style="flex:1"></span>` : ''}${m ? '<button class="ghost" id="del">remove</button>' : ''}<button class="ghost" id="cancel">cancel</button><button class="done" id="done">Done</button></div>
    </div>`;
    const ta = $('ta');
    ta.value = m ? m.text : '';
    const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.max(120, ta.scrollHeight) + 'px'; };
    ta.oninput = grow; grow();
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    ta.onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) commit(); if (e.key === 'Escape') stopEdit(); };
    $('done').onclick = commit;
    $('cancel').onclick = stopEdit;
    if (SR) $('mic').onclick = () => (rec ? rec.stop() : startMic());
    if (m) $('del').onclick = () => { if (confirm('Remove this memory?')) { delete memories[sel]; save(); stopEdit(); } };
  } else if (m) {
    c.innerHTML = `<div style="width:100%"><div class="date-line">${pretty(sel)}</div><div class="memory" id="mem"></div></div>`;
    $('mem').textContent = m.text;
    $('mem').onclick = startEdit;
  } else {
    const future = sel > todayKey();
    c.innerHTML = `<button class="plant-btn" id="pb" ${future ? 'disabled' : ''}>${svg(PLUS)}<span>${future ? 'not yet' : 'plant memory'}</span></button>`;
    $('pb').onclick = startEdit;
  }
}

/* speak-to-write: browser speech recognition, words added after what's already written */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
const buzz = ms => { if (navigator.vibrate) navigator.vibrate(ms); };
const joinText = (before, spoken) =>
  !spoken ? before : before.trim() ? `${before.replace(/\s+$/, '')} ${spoken}` : spoken;
function setMic(on) {
  const b = $('mic'); if (!b) return;
  b.classList.toggle('on', on);
  b.setAttribute('aria-label', on ? 'Stop listening' : 'Speak your memory');
  $('listening').hidden = !on;
  $('ta').placeholder = on ? 'Listening...' : 'Add a memory...';
}
function startMic() {
  const ta = $('ta'), before = ta.value;
  rec = new SR();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = navigator.language || 'en-US';
  rec.onresult = e => {
    let spoken = '';
    for (const r of e.results) spoken += r[0].transcript;
    ta.value = joinText(before, spoken.trim());
    ta.oninput && ta.oninput();
  };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') alert('Allow microphone access for this page to speak your memories.');
  };
  rec.onend = () => { rec = null; setMic(false); buzz(10); };
  rec.start();
  setMic(true);
  buzz(20);
}
function abortMic() { if (rec) { rec.onend = null; rec.abort(); rec = null; } }

function startEdit() { editing = true; document.body.classList.add('typing'); render(); }
function stopEdit() {
  abortMic();
  editing = false; document.body.classList.remove('typing'); render();
  // iOS leaves the page scrolled after the keyboard closes; snap back
  requestAnimationFrame(() => window.scrollTo(0, 0));
}
function commit() {
  const text = $('ta').value.trim();
  if (text) memories[sel] = { text, updated: Date.now() };
  else delete memories[sel];
  save(); stopEdit();
}

function render() {
  $('year').classList.toggle('hidden', view !== 'year');
  $('day').classList.toggle('hidden', view !== 'day');
  $('tYear').classList.toggle('on', view === 'year');
  $('tDay').classList.toggle('on', view === 'day');
  const n = Object.keys(memories).length;
  $('count').textContent = n;
  $('countLabel').textContent = n === 1 ? ' memory planted' : ' memories planted';
  renderHeader();
  if (view === 'year') renderYear(); else renderDay();
}

/* ---------- events ---------- */
$('grid').onclick = e => {
  const c = e.target.closest('.cell'); if (!c) return;
  if (held) { held = false; return; } // a press-and-hold only peeks
  sel = c.dataset.k; view = 'day'; render();
};

/* date preview: hover with a mouse, press and hold on touch */
const tip = document.createElement('div');
tip.className = 'tip';
$('year').appendChild(tip);
const tipDate = k => fromKey(k).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
function showTip(c) {
  const k = c.dataset.k, m = memories[k];
  tip.innerHTML = '<b></b>' + (m ? '<span></span>' : '');
  tip.querySelector('b').textContent = tipDate(k);
  if (m) tip.querySelector('span').textContent = m.text;
  const box = $('year'), x = c.offsetLeft + c.offsetWidth / 2;
  tip.style.left = Math.min(Math.max(x - tip.offsetWidth / 2, 0), box.clientWidth - tip.offsetWidth) + 'px';
  tip.style.top = (c.offsetTop - tip.offsetHeight - 4) + 'px';
  tip.classList.add('on');
}
function hideTip() { tip.classList.remove('on'); }

const canHover = matchMedia('(hover: hover)').matches;
$('grid').addEventListener('mouseover', e => {
  if (!canHover) return;
  const c = e.target.closest('.cell'); if (c) showTip(c);
});
$('grid').addEventListener('mouseleave', hideTip);

let held = false, holdTimer = null;
$('grid').addEventListener('touchstart', e => {
  const c = e.target.closest('.cell'); if (!c) return;
  held = false;
  holdTimer = setTimeout(() => { held = true; tipCell = c; showTip(c); buzz(8); }, 300);
}, { passive: true });
// after the hold, sliding moves the label from day to day instead of scrolling
let tipCell = null;
$('grid').addEventListener('touchmove', e => {
  if (!held) { clearTimeout(holdTimer); return; }
  e.preventDefault();
  const t = e.touches[0];
  const c = document.elementFromPoint(t.clientX, t.clientY)?.closest('.cell');
  if (c && c !== tipCell) { tipCell = c; showTip(c); buzz(5); }
}, { passive: false });
$('grid').addEventListener('touchend', e => {
  clearTimeout(holdTimer);
  if (held) { e.preventDefault(); hideTip(); held = false; }
});
$('strip').onclick = e => {
  const s = e.target.closest('.slot[data-k]'); if (!s || editing) return;
  sel = s.dataset.k; render();
};
$('tYear').onclick = () => { if (editing) return; view = 'year'; year = +sel.slice(0, 4); render(); };
$('tDay').onclick = () => { if (editing) return; view = 'day'; render(); };

const step = n => { const k = addDays(sel, n); if (k <= todayKey()) { sel = k; render(); } };
document.addEventListener('keydown', e => {
  if (editing || view !== 'day') return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
let tx = null;
$('day').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
$('day').addEventListener('touchend', e => {
  if (tx === null || editing) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
});

$('exp').onclick = async () => {
  const name = `memory-garden-${todayKey()}.json`;
  const blob = new Blob([JSON.stringify(memories, null, 2)], { type: 'application/json' });
  // home-screen apps on iOS can't download files, so use the share sheet there
  const file = new File([blob], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Memory Garden backup' }); } catch {}
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('imp').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    let n = 0;
    for (const [k, v] of Object.entries(data)) if (/^\d{4}-\d{2}-\d{2}$/.test(k) && v && typeof v.text === 'string') { memories[k] = v; n++; }
    save(); render(); alert(`Imported ${n} memories.`);
  } catch { alert('That file could not be read.'); }
  e.target.value = '';
};

// refresh "today" if the page stays open past midnight
let lastToday = todayKey();
setInterval(() => { if (todayKey() !== lastToday && !editing) { lastToday = todayKey(); render(); } }, 60000);

render();

// installable app: work offline and ask the browser not to clear saved memories
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
